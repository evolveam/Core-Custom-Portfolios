name: Actualizar portafolios diario

on:
  schedule:
    - cron: '23 14 * * *'
    - cron: '23 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar y aplicar precios nuevos
        run: node scripts/update-portfolio.js

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json index.html
          if git diff --cached --quiet; then
            echo "Sin cambios: no hay sesion nueva disponible."
          else
            git commit -m "Actualizacion automatica de portafolios"
            git fetch origin main
            git rebase origin/main
            git push
          fi
